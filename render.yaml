services:
  - type: web
    plan: free
    runtime: image
    name: n8n-iconicskills1
    image:
      url: docker.io/n8nio/n8n:latest
    
    healthCheckPath: /healthz

    envVars:
      - key: N8N_PORT
        value: "5678"
      
      - key: PORT
        value: "5678"

      - key: N8N_HOST
        value: "0.0.0.0"

      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      - key: DB_TYPE
        value: postgresdb
      
      # Get this from Supabase Dashboard → Database → Connection Pooling
      - key: DB_POSTGRESDB_HOST
        value: aws-0-us-east-1.pooler.supabase.com  # Replace with your actual host
        
      - key: DB_POSTGRESDB_PORT
        value: "5432"  # Session mode port
        
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
        
      - key: DB_POSTGRESDB_USER
        value: postgres.mfqtfzsbbddyxwdzzxsc  # Set to: postgres.xxxxx (your pooled user)
        
      - key: DB_POSTGRESDB_PASSWORD
        value: supabasepowerman1984  # Set to your database password

      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
        
      - key: WEBHOOK_URL
        value: https://n8n-iconicskills1.onrender.com/
