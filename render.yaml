services:
  - type: web
    plan: free
    runtime: image
    name: n8n-iconicskills1
    image:
      url: docker.io/n8nio/n8n:latest
    
    healthCheckPath: /healthz

    envVars:
      - key: N8N_PORT
        value: "5678"
      
      - key: PORT
        value: "5678"

      - key: N8N_HOST
        value: "0.0.0.0"

      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      - key: DB_TYPE
        value: postgresdb
      
      # Direct connection host (check if this resolves to IPv6)
      - key: DB_POSTGRESDB_HOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
        
      - key: DB_POSTGRESDB_PORT
        value: "5432"
        
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
        
      - key: DB_POSTGRESDB_USER
        value: postgres.mfqtfzsbbddyxwdzzxsc
        
      - key: DB_POSTGRESDB_PASSWORD
        value: supabasepowerman1984

      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
        
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
        
      - key: WEBHOOK_URL
        value: https://n8n-iconicskills1.onrender.com/
