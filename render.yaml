services:
  - type: web
    plan: free
    runtime: image
    name: n8n-iconicskills1
    image:
      url: docker.io/n8nio/n8n:latest
    
    # Health check helps Render detect the service is running
    healthCheckPath: /healthz

    envVars:
      # Port configuration - n8n needs both
      - key: N8N_PORT
        value: "5678"
      
      - key: PORT
        value: "5678"

      # Bind to all interfaces so Render can reach it
      - key: N8N_HOST
        value: "0.0.0.0"

      # Encryption key for credentials
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Database Configuration
      - key: DB_TYPE
        value: postgresdb
      
      # FIX: Use your actual Supabase pooler host
      # Format: aws-0-[region].pooler.supabase.com
      - key: DB_POSTGRESDB_HOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
        
      - key: DB_POSTGRESDB_PORT
        value: "6543"
        
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
        
      - key: DB_POSTGRESDB_USER
        sync: false
        
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      # SSL Configuration for Supabase
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
        
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"

      # Optional: Set your webhook URL
      - key: WEBHOOK_URL
        value: https://n8n-iconicskills1.onrender.com/
