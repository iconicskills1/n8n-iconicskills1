services:
  - type: web
    plan: free
    runtime: image
    name: n8n-iconicskills1
    image:
      url: docker.io/n8nio/n8n:latest
    
    healthCheckPath: /healthz

    envVars:
      - key: N8N_PORT
        value: "5678"
      
      - key: PORT
        value: "5678"

      - key: N8N_HOST
        value: "0.0.0.0"

      - key: N8N_ENCRYPTION_KEY
        generateValue: true  # This is fine for fresh start

      - key: DB_TYPE
        value: postgresdb
      
      - key: DB_POSTGRESDB_HOST
        value: db.mfqtfzsbbddyxwdzzxsc.supabase.co
        
      - key: DB_POSTGRESDB_PORT
        value: "5432"
        
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
        
      - key: DB_POSTGRESDB_USER
        value: postgres
        
      - key: DB_POSTGRESDB_PASSWORD
        sync: false  # Set in Render dashboard

      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
        
      - key: WEBHOOK_URL
        value: https://n8n-iconicskills1.onrender.com/
