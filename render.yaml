services:
  - type: web
    plan: free
    runtime: image
    name: n8n-iconicskills1
    image:
      url: docker.io/n8nio/n8n:latest

    healthCheckPath: /healthz

    envVars:
      # CRITICAL: Fixes BOTH DNS IPv4 lookup AND Memory Limit (OOM Crash)
      - key: NODE_OPTIONS
        value: "--dns-result-order=ipv4first --max-old-space-size=280 --optimize_for_size"

      # Save RAM by running execution in main process
      - key: EXECUTIONS_PROCESS
        value: "main"

      # Restrict DB connection pool size to save memory
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "2"
        
      # Disable background telemetry that can hang startup
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"

      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"

      # Port configuration for Render
      - key: N8N_PORT
        value: "5678"
      
      - key: PORT
        value: "5678"

      - key: N8N_LISTEN_ADDRESS
        value: "0.0.0.0"

      # Encryption Key (Fixed static string)
      - key: N8N_ENCRYPTION_KEY
        value: "n8n_iconic_skills_secret_key_2024_secure"

      # --- Database Configuration (Mapped from your Neon Parameters) ---
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_HOST
        value: ep-solitary-base-b4q36a3r.c-6.us-east-2.aws.neon.tech
        
      - key: DB_POSTGRESDB_PORT
        value: "5432"

      - key: DB_POSTGRESDB_DATABASE
        value: neondb

      - key: DB_POSTGRESDB_USER
        value: neondb_owner

      # ⚠️ Make sure this contains your FULL Neon password (including characters after npg_)
      - key: DB_POSTGRESDB_PASSWORD
        value: npg_CvH1FRtMSg8V

      # SSL Settings required by Neon
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"

      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      - key: WEBHOOK_URL
        value: https://n8n-iconicskills1.onrender.com/
