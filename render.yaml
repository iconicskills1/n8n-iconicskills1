services:
  - type: web
    plan: free
    runtime: image
    name: n8n-iconicskills1
    image:
      url: docker.io/n8nio/n8n:latest

    envVars:
      - key: N8N_PORT
        value: "5678"
      
      - key: PORT
        value: "5678"

      - key: N8N_HOST
        value: "0.0.0.0"

      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # ONLY use DB_TYPE and DATABASE_URL
      - key: DB_TYPE
        value: postgresdb

      - key: DATABASE_URL
        sync: false  # Set in Render dashboard

      - key: N8N_WEBHOOK_URL
        value: https://n8n-iconicskills1.onrender.com/

      # Optional: Disable SSL rejection if needed
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
