# Use this Blueprint to deploy n8n on Render as a web
# service that uses an external Supabase Postgres database 
# to store workflow data.

services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service
    image:
      url: docker.io/n8nio/n8n:latest

    envVars:
      # Tell Render to route public internet traffic to n8n's internal port
      - key: PORT
        value: "5678"

      # Generates a base64-encoded key for encrypting credentials in n8n
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Database Configuration for Supabase
      - key: DB_TYPE
        value: postgresdb
      
      # Hardcoded Supabase Pooler host
      - key: DB_POSTGRESDB_HOST
        value: ://supabase.com
        
      # The Supabase connection pooler port (always 6543)
      - key: DB_POSTGRESDB_PORT
        value: "6543"
        
      # Typically 'postgres'
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
        
      # Use your pooled user (e.g., postgres.xxxxxx)
      - key: DB_POSTGRESDB_USER
        sync: false
        
      # Your Supabase database password
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      # Supabase requires SSL connections
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
