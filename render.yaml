# Use this Blueprint to deploy n8n on Render as a web
# service that uses an external Supabase Postgres database 
# to store workflow data.

services:
  - type: web
    plan: free
    # This is the runtime for services that pull a prebuilt Docker image
    runtime: image
    # You can give the service any name
    name: n8n-iconicskills1
    image:
      # Pulls the n8n image tagged as latest from Docker Hub
      url: docker.io/n8nio/n8n:latest

    # All environment variables defined below are required!
    envVars:
      # Generates a base64-encoded key for encrypting credentials in n8n
      - key: PORT
        value: "5678"

      # Do not modify this value after it's generated!
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Database Configuration for Supabase
      - key: DB_TYPE
        value: postgresdb
      
      # Use the Supabase Pooler host (e.g., ://supabase.com)
      - key: DB_POSTGRESDB_HOST
        sync: false
        
      # The Supabase connection pooler port (always 6543)
      - key: DB_POSTGRESDB_PORT
        value: "6543"
        
      # Typically 'postgres'
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
        
      # Use your pooled user (e.g., postgres.xxxxxx)
      - key: DB_POSTGRESDB_USER
        sync: false
        
      # Your Supabase database password
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      # Supabase requires SSL connections
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
